<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>블로그 · AIVIEW</title>
<meta name="description" content="AIVIEW 블로그 글">
<!-- 파비콘 / 웹 아이콘 -->
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta property="og:type" content="article">
<meta property="og:site_name" content="AIVIEW">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="theme.css">
<style>
  /* 이 페이지 고유(블로그 상세) 스타일. 공유 토큰·버튼·GNB·푸터는 theme.css 참고. */
  .post-wrap{max-width:760px;margin:0 auto;padding:88px 24px 80px}
  .post-back{display:inline-flex;align-items:center;gap:7px;font-size:14px;font-weight:700;color:var(--slate);margin-bottom:26px}
  .post-back:hover{color:var(--blue-d)}
  .post-head .cat{display:inline-block;font-size:12px;font-weight:800;letter-spacing:.04em;color:var(--blue);background:var(--soft-2);padding:5px 12px;border-radius:999px}
  .post-head h1{font-size:clamp(28px,4.4vw,42px);font-weight:800;letter-spacing:-.03em;line-height:1.24;margin:16px 0 0}
  .post-meta{margin-top:18px;display:flex;flex-wrap:wrap;gap:14px;font-size:14px;color:var(--slate-2);font-weight:600;padding-bottom:26px;border-bottom:1px solid var(--line)}
  .post-hero{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:var(--r);margin:32px 0 8px;display:block}
  /* 본문 = 읽기용 본문 폰트(차분한 색·넉넉한 행간) */
  .post-content{margin-top:34px;font-size:17px;line-height:1.85;color:#26324a}
  .post-content p{margin:0 0 22px}
  /* 핵심 요약 박스(상단 TL;DR) */
  .post-content .post-tldr{background:var(--soft-2);border:1px solid var(--tint);border-radius:14px;padding:20px 22px;margin:0 0 30px}
  .post-content .post-tldr .tldr-head{font-size:13px;font-weight:800;letter-spacing:.02em;color:var(--blue-d);margin-bottom:12px;display:flex;align-items:center;gap:7px}
  .post-content .post-tldr ul{list-style:none;display:grid;gap:9px;margin:0;padding:0}
  .post-content .post-tldr li{position:relative;padding-left:24px;font-size:15.5px;line-height:1.55;color:var(--ink);font-weight:500}
  .post-content .post-tldr li::before{content:"";position:absolute;left:7px;top:9px;width:6px;height:6px;border-radius:50%;background:var(--blue)}
  /* 소제목 = 본문보다 크지만 페이지 제목(h1)보다 확실히 작게 */
  .post-content h2{font-size:clamp(18px,2vw,22px);font-weight:700;letter-spacing:-.015em;line-height:1.4;color:var(--ink);margin:38px 0 14px}
  .post-content h3{font-size:16.5px;font-weight:700;letter-spacing:-.01em;color:var(--ink);margin:28px 0 10px}
  .post-content strong{font-weight:600;color:var(--ink)}
  .post-content a{color:var(--blue-d);font-weight:600;text-decoration:underline;text-underline-offset:2px;text-decoration-color:var(--blue-2)}
  .post-content a:hover{color:var(--blue)}
  .post-content ul.post-list{margin:0 0 22px;padding-left:4px;list-style:none;display:grid;gap:10px}
  .post-content ul.post-list li{position:relative;padding-left:26px}
  .post-content ul.post-list li::before{content:"";position:absolute;left:6px;top:13px;width:7px;height:7px;border-radius:50%;background:var(--blue)}
  .post-content blockquote{margin:0 0 24px;padding:4px 0 4px 22px;border-left:3px solid var(--blue);color:var(--ink);font-weight:600;font-size:18px;line-height:1.7}
  .post-figure{margin:8px 0 28px}
  .post-figure img{width:100%;border-radius:var(--r);display:block}
  .post-figure figcaption{margin-top:10px;font-size:13.5px;color:var(--slate-2);text-align:center}
  /* 표 — 통계 비교용 */
  .post-table-wrap{margin:8px 0 28px;overflow-x:auto;border:1px solid var(--line);border-radius:12px}
  .post-table{width:100%;border-collapse:collapse;font-size:15px;line-height:1.55}
  .post-table th,.post-table td{padding:13px 16px;text-align:left;border-bottom:1px solid var(--line)}
  .post-table thead th{background:var(--soft-2);color:var(--ink);font-weight:800;font-size:13.5px;white-space:nowrap}
  .post-table tbody tr:last-child td{border-bottom:none}
  .post-table tbody tr:nth-child(even){background:var(--soft)}
  .post-table td:first-child{font-weight:700;color:var(--ink)}
  .post-foot{margin-top:56px;padding-top:30px;border-top:1px solid var(--line);text-align:center}
  @media(max-width:560px){.post-table th,.post-table td{padding:11px 13px;font-size:14px}}
  .blog-state{text-align:center;padding:120px 24px;color:var(--slate-2)}
  .blog-state i{font-size:36px;margin-bottom:18px;display:block;color:var(--line)}
  @media(max-width:560px){.post-wrap{padding:72px 16px 60px}.post-content{font-size:16px}}
</style>
</head>
<body>

<!-- GNB (공유 partial) -->
<site-header></site-header>

<main>
  <div id="state" class="blog-state">
    <i class="fa-solid fa-spinner fa-spin"></i>
    불러오는 중…
  </div>
  <article id="article" class="post-wrap" hidden></article>
</main>

<!-- FOOTER (공유 partial) -->
<site-footer></site-footer>

<script src="partials.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="blog-data.js"></script>
<script>
(function () {
  var state = document.getElementById('state');
  var article = document.getElementById('article');
  var db = window.AIVIEW_DB;

  function showState(html) {
    state.hidden = false;
    article.hidden = true;
    state.innerHTML = html;
  }

  // 인라인 마크다운(**굵게**, [텍스트](url)) → HTML. esc 후 토큰만 치환(XSS 안전).
  function inline(s) {
    var t = esc(s);
    t = t.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
    t = t.replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g,
      '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
    return t;
  }

  function isTable(lines) {
    if (lines.length < 2) return false;
    var allPipe = lines.every(function (l) { return l.trim().charAt(0) === '|'; });
    var sep = lines[1];
    return allPipe && sep.indexOf('-') >= 0 && /^[\s|:\-]+$/.test(sep);
  }

  function splitRow(line) {
    return line.trim().replace(/^\|/, '').replace(/\|$/, '').split('|')
      .map(function (c) { return c.trim(); });
  }

  // 본문: 빈 줄로 블록 분리 후 간이 마크다운 렌더(소제목·표·목록·인용·이미지·문단)
  function renderContent(text) {
    var blocks = String(text || '').split(/\n{2,}/)
      .map(function (b) { return b.trim(); })
      .filter(Boolean);

    return blocks.map(function (block) {
      // ::: 요약 ... :::  → 상단 핵심 요약 박스
      if (/^:::\s*요약/.test(block)) {
        var items = block.split('\n').slice(1)
          .filter(function (l) { return l.trim() && l.trim() !== ':::'; })
          .map(function (l) { return '<li>' + inline(l.replace(/^[-*]\s*/, '')) + '</li>'; }).join('');
        return '<div class="post-tldr"><div class="tldr-head"><i class="fa-solid fa-bolt"></i> 핵심 요약</div><ul>' + items + '</ul></div>';
      }
      var img = block.match(/^!\[(.*?)\]\((.*?)\)$/);
      if (img) {
        var cap = img[1] ? '<figcaption>' + inline(img[1]) + '</figcaption>' : '';
        return '<figure class="post-figure"><img src="' + esc(img[2]) +
          '" alt="' + esc(img[1]) + '" loading="lazy">' + cap + '</figure>';
      }
      if (/^###\s+/.test(block)) return '<h3>' + inline(block.replace(/^###\s+/, '')) + '</h3>';
      if (/^##\s+/.test(block)) return '<h2>' + inline(block.replace(/^##\s+/, '')) + '</h2>';

      var lines = block.split('\n');

      if (isTable(lines)) {
        var head = splitRow(lines[0]).map(function (c) { return '<th>' + inline(c) + '</th>'; }).join('');
        var body = lines.slice(2).map(function (r) {
          return '<tr>' + splitRow(r).map(function (c) { return '<td>' + inline(c) + '</td>'; }).join('') + '</tr>';
        }).join('');
        return '<div class="post-table-wrap"><table class="post-table"><thead><tr>' +
          head + '</tr></thead><tbody>' + body + '</tbody></table></div>';
      }
      if (lines.every(function (l) { return /^[-*]\s+/.test(l); })) {
        return '<ul class="post-list">' + lines.map(function (l) {
          return '<li>' + inline(l.replace(/^[-*]\s+/, '')) + '</li>';
        }).join('') + '</ul>';
      }
      if (lines.every(function (l) { return /^>\s?/.test(l); })) {
        return '<blockquote>' + inline(lines.map(function (l) { return l.replace(/^>\s?/, ''); }).join('\n')) + '</blockquote>';
      }
      return '<p>' + inline(block).replace(/\n/g, '<br>') + '</p>';
    }).join('');
  }

  async function load() {
    var id = new URLSearchParams(location.search).get('id');
    if (!id) { showState('<i class="fa-solid fa-link-slash"></i>잘못된 주소입니다.'); return; }
    if (!db) { showState('<i class="fa-solid fa-triangle-exclamation"></i>데이터 연결에 실패했습니다.'); return; }
    try {
      var res = await db.from('posts').select('*').eq('id', id).single();
      if (res.error) throw res.error;
      var p = res.data;
      if (!p || p.published === false) { showState('<i class="fa-regular fa-file"></i>글을 찾을 수 없습니다.'); return; }

      document.title = p.title + ' · AIVIEW 블로그';
      var meta = [];
      if (p.author) meta.push('<span><i class="fa-regular fa-user"></i> ' + esc(p.author) + '</span>');
      meta.push('<span>' + fmtDate(p.created_at) + '</span>');

      var hero = p.cover_url ? '<img class="post-hero" src="' + esc(p.cover_url) + '" alt="">' : '';

      article.innerHTML =
        '<a href="blog.html" class="post-back"><i class="fa-solid fa-arrow-left"></i> 블로그 목록</a>' +
        '<div class="post-head">' +
          '<span class="cat">' + esc(p.category || '기타') + '</span>' +
          '<h1>' + esc(p.title) + '</h1>' +
          '<div class="post-meta">' + meta.join('') + '</div>' +
        '</div>' +
        hero +
        '<div class="post-content">' + renderContent(p.content) + '</div>' +
        '<div class="post-foot"><a href="blog.html" class="btn btn-out"><i class="fa-solid fa-arrow-left"></i> 목록으로</a></div>';

      state.hidden = true;
      article.hidden = false;
    } catch (err) {
      console.error('post load failed:', err);
      showState('<i class="fa-solid fa-triangle-exclamation"></i>글을 불러오지 못했습니다.');
    }
  }

  load();
})();
</script>
</body>
</html>
