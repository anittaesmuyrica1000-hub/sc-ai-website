<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AIVIEW · 히어로 다크버전 미리보기</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="theme.css">
<style>
  /* ===== 히어로 다크버전 — index의 라이트 히어로를 다크 톤으로 오버라이드 ===== */
  /* 배경: 밝은 블루 그라데이션 → 딥 네이비 그라데이션 */
  .hero-bg{position:relative;overflow:hidden;min-height:100vh;display:flex;align-items:center;
    background:
      radial-gradient(62% 52% at 50% 40%, rgba(90,120,255,.20) 0%, rgba(120,80,220,.10) 42%, transparent 72%),
      linear-gradient(160deg,#070B1A 0%,#0A1330 50%,#04060E 100%)}
  /* 입자 캔버스 — 라이트 버전과 동일(마스크로 외곽 페이드) */
  .hero-bg #hero-particles{position:absolute;inset:0;z-index:0;width:100%;height:100%;pointer-events:none;
    -webkit-mask-image:radial-gradient(ellipse 72% 64% at 50% 44%, #000 26%, transparent 86%);
            mask-image:radial-gradient(ellipse 72% 64% at 50% 44%, #000 26%, transparent 86%)}
  @media(prefers-reduced-motion:reduce){.hero-bg #hero-particles{display:none}}

  .decl{background:transparent;min-height:auto;display:flex;align-items:center;position:relative;z-index:1;padding:64px 0;width:100%}
  .decl .wrap{position:relative;z-index:2;max-width:840px;text-align:center;margin:0 auto}
  /* tagchip — 다크 변형(반투명 라이트) */
  .tagchip{display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.06);
    border:1px solid rgba(255,255,255,.16);border-radius:999px;padding:7px 16px;font-size:13px;font-weight:700;
    color:#C7D2E8;margin-bottom:24px;box-shadow:none}
  .tagchip i{color:#6E9BFF}
  /* 헤드라인 — 흰색, 강조어(.blue)는 그라데이션 유지 */
  .decl h1{font-size:clamp(34px,4.6vw,56px);font-weight:800;line-height:1.3;letter-spacing:-.04em;color:#fff}
  .decl h1 .blue{display:inline;background:linear-gradient(to right,#5B8DF7,#8AA0FF,#B98DFF,#8AA0FF,#5B8DF7);
    background-size:200% auto;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
    color:transparent;animation:textGrad 5s linear infinite}
  @keyframes textGrad{to{background-position:200% center}}
  /* '진짜' — 그라데이션 밑줄 2줄(화이트 글로우 제거) */
  .decl h1 .real{position:relative;animation:textGrad 5s linear infinite}
  .decl h1 .real::after,.decl h1 .real::before{content:"";position:absolute;left:0;right:0;height:.07em;border-radius:999px;
    background:linear-gradient(to right,#5B8DF7,#8AA0FF,#B98DFF,#8AA0FF,#5B8DF7);background-size:200% auto;
    animation:textGrad 5s linear infinite}
  .decl h1 .real::after{bottom:-.12em}
  .decl h1 .real::before{bottom:-.26em}
  .decl p{font-size:19px;color:#AEB9D4;margin:24px auto 32px;max-width:560px;line-height:1.4}
  .decl p .blue{color:#7FA6FF}
  .decl-cta{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}

  .preview-tag{position:fixed;top:14px;left:14px;z-index:99;background:rgba(255,255,255,.08);color:#cdd8ef;
    border:1px solid rgba(255,255,255,.16);border-radius:999px;padding:6px 14px;font-size:12px;font-weight:700}
</style>
</head>
<body>

<div class="preview-tag">히어로 다크버전 미리보기 · hero-dark-preview.html</div>

<div class="hero-bg">
<canvas id="hero-particles" aria-hidden="true"></canvas>
<section class="decl" id="hero">
  <div class="wrap">
    <div>
      <div class="tagchip"><i class="fa-solid fa-bolt"></i> AI 면접 채용 검증</div>
      <h1><span class="blue">수천 명</span>을 검토하고,<br>책상엔 <span class="blue real" id="real-word">‘진짜’</span>만 올립니다.</h1>
      <p><span class="blue" style="font-weight:700">AI 면접</span>이 전 지원자를 검증하고,<br>검증된 핵심 인재 리포트만 채용팀에 전달합니다.</p>
      <div class="decl-cta">
        <a href="apply.html" class="btn btn-blue">무료 체험하기 <i class="fa-solid fa-arrow-right"></i></a>
      </div>
    </div>
  </div>
</section>
</div>

<script>
// 입자 수렴 모션 — 다크 배경용(밝은 블루→보라, 또렷하게)
(function(){
  if(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  function run(canvasId, targetId, colorFor, maxA){
    var c=document.getElementById(canvasId); if(!c||!c.getContext) return;
    var x=c.getContext('2d'), dpr=Math.min(window.devicePixelRatio||1,2),
        word=document.getElementById(targetId), tx=0, ty=0, Rmax=1;
    function aim(){
      if(!word){ tx=c.width/2; ty=c.height*0.44; return; }
      var cr=c.getBoundingClientRect(), wr=word.getBoundingClientRect();
      tx=(wr.left+wr.width/2 - cr.left)*dpr; ty=(wr.top+wr.height/2 - cr.top)*dpr;
    }
    function size(){ c.width=c.offsetWidth*dpr; c.height=c.offsetHeight*dpr; Rmax=Math.max(c.width,c.height)*0.62; aim(); }
    function spawn(){ var a=Math.random()*6.2832, R=Rmax*(0.85+Math.random()*0.55);
      return {x:tx+Math.cos(a)*R, y:ty+Math.sin(a)*R, sp:(1.4+Math.random()*1.9)*dpr, s:(0.6+Math.random()*1.0)*dpr, col:colorFor()}; }
    var P=[];
    function init(){ P=[]; for(var i=0;i<140;i++){ var p=spawn(), t=Math.random();
      p.x=tx+(p.x-tx)*t; p.y=ty+(p.y-ty)*t; P.push(p); } }
    size(); init();
    window.addEventListener('resize', size);
    window.addEventListener('load', aim);
    function tick(){
      aim();
      x.clearRect(0,0,c.width,c.height);
      for(var i=0;i<P.length;i++){ var p=P[i];
        var dx=tx-p.x, dy=ty-p.y, d=Math.hypot(dx,dy)||1;
        if(d<10){ var n=spawn(); p.x=n.x; p.y=n.y; p.sp=n.sp; p.s=n.s; p.col=n.col; dx=tx-p.x; dy=ty-p.y; d=Math.hypot(dx,dy)||1; }
        p.x+=dx/d*p.sp; p.y+=dy/d*p.sp;
        var alpha=Math.min(maxA, (d/(c.height*0.55))*(maxA*1.25));
        var rgb=p.col[0]+','+p.col[1]+','+p.col[2];
        // 발광 글로우 — 화려한 느낌(다크 배경에서 입자가 빛나듯)
        x.shadowColor='rgba('+rgb+','+alpha.toFixed(3)+')';
        x.shadowBlur=p.s*4;
        x.fillStyle='rgba('+rgb+','+alpha.toFixed(3)+')';
        x.beginPath(); x.arc(p.x,p.y,p.s,0,6.2832); x.fill();
      }
      x.shadowBlur=0;
      requestAnimationFrame(tick);
    }
    tick();
  }
  // 다크 배경: 화려한 스펙트럼 팔레트(시안→블루→바이올렛→핑크)
  var STOPS=[[63,224,255],[91,141,247],[164,114,255],[255,122,217]];
  function gradCol(){ var t=Math.random()*(STOPS.length-1), i=Math.floor(t), k=t-i,
    a=STOPS[i], b=STOPS[Math.min(i+1,STOPS.length-1)];
    return [Math.round(a[0]+(b[0]-a[0])*k),Math.round(a[1]+(b[1]-a[1])*k),Math.round(a[2]+(b[2]-a[2])*k)]; }
  run('hero-particles','real-word',gradCol,.9);
})();
</script>
</body>
</html>
