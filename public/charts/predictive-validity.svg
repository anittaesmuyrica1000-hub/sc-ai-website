<svg xmlns="http://www.w3.org/2000/svg" width="800" height="300" viewBox="0 0 800 300">
<rect width="800" height="300" rx="14" fill="#FFFFFF" stroke="#E5EBF5"/>
<text x="24" y="40" font-size="19" font-weight="800" fill="#142036" font-family="'Pretendard','Apple SD Gothic Neo','Noto Sans KR',sans-serif">무엇이 직무 성과를 예측하나?</text>
<text x="24" y="66" font-size="13.5" fill="#566179" font-family="'Pretendard','Apple SD Gothic Neo','Noto Sans KR',sans-serif">예측타당도 — 0(성과와 무관)에서 1(성과를 잘 맞힘) 사이. 값이 클수록 실제 성과를 잘 예측합니다.</text>
<text x="24" y="116" font-size="16" font-weight="700" fill="#142036" font-family="'Pretendard','Apple SD Gothic Neo','Noto Sans KR',sans-serif">구조화 면접</text><rect x="168" y="96" width="326.4" height="30" rx="6" fill="#2E6CF0"/><text x="506.4" y="117" font-size="17" font-family="'Pretendard','Apple SD Gothic Neo','Noto Sans KR',sans-serif"><tspan font-weight="800" fill="#142036">.51</tspan><tspan font-size="14" font-weight="600" fill="#8A93A8"> 높음</tspan></text><text x="24" y="172" font-size="16" font-weight="700" fill="#142036" font-family="'Pretendard','Apple SD Gothic Neo','Noto Sans KR',sans-serif">비구조화 면접</text><rect x="168" y="152" width="243.19999999999996" height="30" rx="6" fill="#93B1EE"/><text x="423.19999999999993" y="173" font-size="17" font-family="'Pretendard','Apple SD Gothic Neo','Noto Sans KR',sans-serif"><tspan font-weight="800" fill="#142036">.38</tspan><tspan font-size="14" font-weight="600" fill="#8A93A8"> 보통</tspan></text><text x="24" y="228" font-size="16" font-weight="700" fill="#142036" font-family="'Pretendard','Apple SD Gothic Neo','Noto Sans KR',sans-serif">학벌·스펙</text><rect x="168" y="208" width="6.3999999999999995" height="30" rx="6" fill="#CBD3E1"/><text x="186.4" y="229" font-size="17" font-family="'Pretendard','Apple SD Gothic Neo','Noto Sans KR',sans-serif"><tspan font-weight="800" fill="#142036">.01</tspan><tspan font-size="14" font-weight="600" fill="#8A93A8"> 거의 없음</tspan></text>
<text x="24" y="282" font-size="12.5" fill="#8A93A8" font-family="'Pretendard','Apple SD Gothic Neo','Noto Sans KR',sans-serif">구조화·비구조화 면접: Schmidt &amp; Hunter(1998) · 학벌–성과 상관: 한 국내 기업 자체 분석.</text>
