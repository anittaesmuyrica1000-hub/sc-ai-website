<!-- 공유 토큰 + 컴포넌트(SSOT): theme.css 를 고치면 전 페이지가 함께 바뀐다 -->
<link rel="stylesheet" href="theme.css">
<style>
  /* 이 페이지 고유(신청 폼) 스타일만 둔다. 공유 토큰·버튼·GNB·푸터는 theme.css 참고. */

  /* APPLY */
  .apply{background:linear-gradient(180deg,#EAF1FE 0%,#F4F8FF 48%,#fff 100%);padding:60px 0 92px;min-height:calc(100vh - 64px)}
  .apply-grid{max-width:540px;margin:0 auto}
  .apply-formcol{display:flex;flex-direction:column}

  /* 채팅 문의 버블(고정) — 마케팅 패널 제거 후 안내만 유지 */
  .chat-fab{position:fixed;right:24px;bottom:24px;z-index:60;display:flex;align-items:center;gap:11px;background:var(--ink);color:#fff;border-radius:16px 16px 4px 16px;padding:13px 18px;box-shadow:0 14px 34px rgba(15,23,42,.28);max-width:280px;transition:transform .18s,box-shadow .18s}
  .chat-fab:hover{transform:translateY(-2px);box-shadow:0 18px 40px rgba(15,23,42,.34)}
  .chat-fab i{color:#8FB4FF;font-size:18px}
  .chat-fab .cb-t{display:block;font-size:13.5px;font-weight:700}
  .chat-fab .cb-s{display:block;font-size:11.5px;color:rgba(255,255,255,.7);margin-top:2px}
  @media(max-width:560px){.chat-fab{right:14px;bottom:14px;padding:12px 15px}.chat-fab .cb-s{display:none}}

  .apply-card{background:#fff;border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);padding:34px}
  .apply-card .ct{font-size:20px;font-weight:800;letter-spacing:-.02em;margin-bottom:4px}
  .apply-card .cs{font-size:14px;color:var(--slate);margin-bottom:24px}
  .field{margin-bottom:16px}
  .field label{display:block;font-size:13px;font-weight:700;color:var(--ink);margin-bottom:7px}
  .field label .req{color:var(--blue);margin-left:2px}
  .field input,.field select,.field textarea{width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:11px;font-size:15px;font-family:inherit;color:var(--ink);background:#fff;transition:.15s}
  .field input::placeholder,.field textarea::placeholder{color:var(--slate-2)}
  .field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--blue-2);box-shadow:0 0 0 3px rgba(91,141,247,.16)}
  .field textarea{resize:vertical;min-height:86px}
  .field-row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .field.invalid input,.field.invalid select{border-color:var(--red);box-shadow:0 0 0 3px rgba(224,88,74,.13)}
  .field .err{display:none;color:var(--red);font-size:12.5px;margin-top:6px}
  .field.invalid .err{display:block}
  .agree{display:flex;align-items:flex-start;gap:9px;font-size:13.5px;color:var(--slate);margin:8px 0 22px;line-height:1.5}
  .agree input{width:auto;margin-top:3px;flex-shrink:0;accent-color:var(--blue)}
  .agree a{color:var(--blue);text-decoration:underline}
  .agree.invalid{color:var(--red)}
  .apply-card .btn{width:100%;justify-content:center;font-size:16px;padding:15px}
  .apply-card .btn[disabled]{opacity:.6;cursor:default;transform:none}
  .form-err{display:none;background:#FDECEA;border:1px solid #F3C2BC;color:#B23B2E;font-size:13.5px;font-weight:600;border-radius:10px;padding:11px 14px;margin-bottom:14px}
  .form-err.show{display:block}

  .apply-done{display:none;text-align:center;padding:24px 8px 14px}
  .apply-done .dot{width:76px;height:76px;border-radius:50%;background:var(--soft-2);color:var(--green);display:grid;place-items:center;font-size:36px;margin:0 auto 22px}
  .apply-done h2{font-size:24px;margin-bottom:12px}
  .apply-done p{color:var(--slate);font-size:15.5px;margin-bottom:26px}

  @media(max-width:560px){
    .field-row{grid-template-columns:1fr}.apply-card{padding:24px}.apply{padding:40px 0 64px}
  }
</style>
</head>
<body>

<!-- GNB (공유 partial) -->
<site-header></site-header>

<!-- 무료 신청 -->
<section class="apply">
  <div class="wrap">
    <div class="apply-grid">

      <!-- 좌: 도입 문의 폼 -->
      <div class="apply-formcol">
      <div class="apply-card" id="applyCard">
        <div class="ct">도입 문의</div>
        <div class="cs">아래 정보를 남겨주시면 영업일 기준 1일 내 연락드립니다.</div>
        <form id="applyForm" novalidate>
          <div class="field-row">
            <div class="field">
              <label for="f-name">이름 <span class="req">*</span></label>
              <input type="text" id="f-name" name="name" placeholder="홍길동" required>
              <div class="err">이름을 입력해 주세요.</div>
            </div>
            <div class="field">
              <label for="f-company">회사 <span class="req">*</span></label>
              <input type="text" id="f-company" name="company" placeholder="회사명" required>
              <div class="err">회사를 입력해 주세요.</div>
            </div>
          </div>

          <div class="field">
            <label for="f-email">업무 이메일 <span class="req">*</span></label>
            <input type="email" id="f-email" name="email" placeholder="you@company.com" required>
            <div class="err">올바른 이메일을 입력해 주세요.</div>
          </div>

          <div class="field-row">
            <div class="field">
              <label for="f-role">직무 / 직책</label>
              <input type="text" id="f-role" name="role" placeholder="예: 인사팀장">
            </div>
            <div class="field">
              <label for="f-phone">연락처</label>
              <input type="tel" id="f-phone" name="phone" placeholder="010-0000-0000">
            </div>
          </div>

          <div class="field">
            <label for="f-size">연간 채용 규모 <span class="req">*</span></label>
            <select id="f-size" name="size" required>
              <option value="" selected disabled>선택해 주세요</option>
              <option value="1-10">1~10명</option>
              <option value="11-50">11~50명</option>
              <option value="51-200">51~200명</option>
              <option value="200+">200명 이상</option>
            </select>
            <div class="err">채용 규모를 선택해 주세요.</div>
          </div>

          <div class="field">
            <label for="f-memo">문의 메모</label>
            <textarea id="f-memo" name="memo" placeholder="궁금한 점이나 도입 배경을 자유롭게 적어주세요."></textarea>
          </div>

          <label class="agree" id="f-agree-wrap">
            <input type="checkbox" id="f-agree" name="agree" required>
            <span><a href="#">개인정보 수집·이용</a>에 동의합니다. (필수)</span>
          </label>

          <div class="form-err" id="formErr"></div>
          <button type="submit" class="btn btn-blue" id="submitBtn">도입 문의하기 <i class="fa-solid fa-arrow-right"></i></button>
        </form>
      </div>

      <!-- 제출 완료 상태 (폼 카드 자리 교체) -->
      <div class="apply-card apply-done" id="applyDone">
        <div class="dot"><i class="fa-solid fa-check"></i></div>
        <h2>문의가 접수되었습니다.</h2>
        <p>영업일 기준 1일 내 담당자가<br>입력해 주신 이메일로 연락드립니다.</p>
        <a href="index.html" class="btn btn-out">홈으로 돌아가기</a>
      </div>
      </div><!-- /apply-formcol -->

    </div>
  </div>

  <!-- 채팅 문의 버블(고정) — 마케팅 패널은 제거하고 이 안내만 유지 -->
  <a class="chat-fab" href="#applyCard" aria-label="채팅 문의">
    <i class="fa-solid fa-comment-dots"></i>
    <span>
      <span class="cb-t">궁금한 건 채팅으로 문의하세요</span>
      <span class="cb-s">평균 몇 분 내 답변드립니다</span>
    </span>
  </a>
</section>

<!-- FOOTER (공유 partial) -->
<site-footer></site-footer>

<script src="partials.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function () {
  // Supabase 연결 — publishable(공개) 키. RLS 로 INSERT 만 허용되어 노출돼도 안전하다.
  // 로컬(file://·localhost)·배포(Vercel) 모두 동일 프로젝트/데이터에 연결된다.
  var SUPABASE_URL = 'https://ymzlcghqamkynuvotzgh.supabase.co';
  var SUPABASE_KEY = 'sb_publishable_QZ9NGClQjBIuPWz7CR8_wA_Acv9anJQ';

  var form = document.getElementById('applyForm');
  var card = document.getElementById('applyCard');
  var done = document.getElementById('applyDone');
  var btn = document.getElementById('submitBtn');
  var errBox = document.getElementById('formErr');
  if (!form) return;

  // index.html 최종 CTA 인라인 폼에서 넘어온 값을 채운다 (?name=&company=&email=)
  try {
    var qp = new URLSearchParams(location.search);
    [['name', 'f-name'], ['company', 'f-company'], ['email', 'f-email']].forEach(function (m) {
      var v = qp.get(m[0]); var el = document.getElementById(m[1]);
      if (v && el) el.value = v;
    });
  } catch (e) {}

  var db = (window.supabase && window.supabase.createClient)
    ? window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY)
    : null;

  var emailRe = /^[^@\s]+@[^@\s]+\.[^@\s]+$/;

  function val(id) { var el = document.getElementById(id); return el ? el.value.trim() : ''; }
  function showError(msg) { errBox.textContent = msg; errBox.classList.add('show'); }
  function setLoading(on) {
    btn.disabled = on;
    btn.innerHTML = on
      ? '전송 중… <i class="fa-solid fa-spinner fa-spin"></i>'
      : '무료 신청하기 <i class="fa-solid fa-arrow-right"></i>';
  }

  form.addEventListener('submit', async function (e) {
    e.preventDefault();
    errBox.classList.remove('show');
    var valid = true;

    // 검증 상태 초기화
    form.querySelectorAll('.invalid').forEach(function (el) { el.classList.remove('invalid'); });

    form.querySelectorAll('[required]').forEach(function (el) {
      var ok = el.type === 'checkbox' ? el.checked : el.value.trim() !== '';
      if (ok && el.type === 'email') ok = emailRe.test(el.value.trim());
      if (!ok) {
        valid = false;
        var box = el.closest('.field') || el.closest('.agree');
        if (box) box.classList.add('invalid');
      }
    });

    if (!valid) {
      var first = form.querySelector('.invalid input, .invalid select');
      if (first) first.focus();
      return;
    }

    var payload = {
      name: val('f-name'),
      company: val('f-company'),
      email: val('f-email'),
      role: val('f-role') || null,
      phone: val('f-phone') || null,
      size: val('f-size'),
      memo: val('f-memo') || null
    };

    setLoading(true);
    try {
      if (!db) throw new Error('Supabase 클라이언트를 불러오지 못했습니다.');
      var res = await db.from('signups').insert(payload);
      if (res.error) throw res.error;

      // 저장 성공 → 완료 화면으로 전환
      card.style.display = 'none';
      done.style.display = 'block';
      done.scrollIntoView({ behavior: 'smooth', block: 'center' });
    } catch (err) {
      setLoading(false);
      showError('신청 저장 중 문제가 발생했습니다. 잠시 후 다시 시도해 주세요.');
      console.error('signup insert failed:', err);
    }
  });

  // 입력 시 해당 필드의 오류 표시 해제
  form.addEventListener('input', function (e) {
    var box = e.target.closest('.field') || e.target.closest('.agree');
    if (box) box.classList.remove('invalid');
  });
})();
</script>
</body>
</html>
