<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>블로그 관리 · AIVIEW</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="theme.css">
<style>
  /* 블로그 관리(어드민) 전용. 로그인 미적용. 공유 버튼·토큰은 theme.css. */
  .admin{max-width:1100px;margin:0 auto;padding:88px 24px 80px}
  .admin-head{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:8px}
  .admin-head h1{font-size:clamp(24px,3vw,32px);font-weight:800;letter-spacing:-.02em}
  .admin-head .sub{color:var(--slate);font-size:15px;margin-top:4px}
  .admin-note{background:#FFF8E6;border:1px solid #F4E2A8;color:#8A6A12;font-size:13px;font-weight:600;border-radius:10px;padding:10px 14px;margin:14px 0 26px}
  .admin-grid{display:grid;grid-template-columns:1fr 1.1fr;gap:36px;align-items:start}

  /* 폼 카드 */
  .card{background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:28px}
  .card h2{font-size:18px;font-weight:800;margin-bottom:18px}
  .field{margin-bottom:15px}
  .field label{display:block;font-size:13px;font-weight:700;color:var(--ink);margin-bottom:6px}
  .field label .req{color:var(--blue)}
  .field input,.field select,.field textarea{width:100%;padding:12px 13px;border:1px solid var(--line);border-radius:10px;font-size:14.5px;font-family:inherit;color:var(--ink);background:#fff;transition:.15s}
  .field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--blue-2);box-shadow:0 0 0 3px rgba(91,141,247,.16)}
  .field textarea{resize:vertical;min-height:200px;line-height:1.7}
  .field-row{display:grid;grid-template-columns:1fr 1fr;gap:13px}
  .field .hint{font-size:12px;color:var(--slate-2);margin-top:5px}
  .check{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600;color:var(--ink);margin:4px 0 18px}
  .check input{width:auto;accent-color:var(--blue)}
  .form-actions{display:flex;gap:10px}
  .form-actions .btn{flex:1;justify-content:center}
  .form-msg{display:none;font-size:13.5px;font-weight:600;border-radius:9px;padding:10px 13px;margin-bottom:14px}
  .form-msg.ok{display:block;background:#E8F6EE;border:1px solid #BFE4CD;color:#1B7A41}
  .form-msg.err{display:block;background:#FDECEA;border:1px solid #F3C2BC;color:#B23B2E}

  /* 목록 */
  .list-card{padding:0;overflow:hidden}
  .list-head{display:flex;align-items:center;justify-content:space-between;padding:20px 24px;border-bottom:1px solid var(--line)}
  .list-head h2{margin:0;font-size:18px;font-weight:800}
  .list-head .count{font-size:13px;color:var(--slate-2);font-weight:700}
  .post-row{display:flex;align-items:center;gap:14px;padding:16px 24px;border-bottom:1px solid var(--line)}
  .post-row:last-child{border-bottom:none}
  .post-row .thumb{width:54px;height:40px;border-radius:7px;object-fit:cover;background:linear-gradient(135deg,var(--blue),var(--blue-2));flex-shrink:0;display:grid;place-items:center;color:#fff;font-size:14px}
  .post-row .meta{flex:1;min-width:0}
  .post-row .meta .t{font-size:15px;font-weight:700;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .post-row .meta .s{font-size:12.5px;color:var(--slate-2);margin-top:3px}
  .post-row .meta .s .draft{color:var(--amber);font-weight:700}
  .row-actions{display:flex;gap:6px;flex-shrink:0}
  .icon-btn{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:#fff;color:var(--slate);cursor:pointer;transition:.15s;font-size:13px}
  .icon-btn:hover{border-color:var(--blue-2);color:var(--blue-d)}
  .icon-btn.del:hover{border-color:var(--red);color:var(--red)}
  .list-state{padding:60px 24px;text-align:center;color:var(--slate-2);font-size:14px}

  @media(max-width:880px){.admin-grid{grid-template-columns:1fr;gap:28px}.admin{padding:76px 16px 60px}}
</style>
</head>
<body>

<!-- GNB (공유 partial) -->
<site-header></site-header>

<main class="admin">
  <div class="admin-head">
    <div>
      <h1>블로그 관리</h1>
      <div class="sub">글을 등록·수정·삭제합니다.</div>
    </div>
    <a href="blog.html" class="btn btn-out"><i class="fa-solid fa-arrow-up-right-from-square"></i> 블로그 보기</a>
  </div>
  <div class="admin-note"><i class="fa-solid fa-circle-info"></i> 현재 로그인 없이 접근 가능한 임시 관리 페이지입니다. (검색 비노출)</div>

  <div class="admin-grid">

    <!-- 등록/수정 폼 -->
    <div class="card">
      <h2 id="formTitle">새 글 작성</h2>
      <div class="form-msg" id="formMsg"></div>
      <form id="postForm" novalidate>
        <input type="hidden" id="f-id">
        <div class="field">
          <label for="f-title">제목 <span class="req">*</span></label>
          <input type="text" id="f-title" placeholder="글 제목" required>
        </div>
        <div class="field-row">
          <div class="field">
            <label for="f-category">카테고리</label>
            <input type="text" id="f-category" placeholder="예: AI 면접" list="catList">
            <datalist id="catList"></datalist>
          </div>
          <div class="field">
            <label for="f-author">작성자</label>
            <input type="text" id="f-author" placeholder="예: AIVIEW 팀">
          </div>
        </div>
        <div class="field">
          <label for="f-cover">커버 이미지 URL</label>
          <input type="url" id="f-cover" placeholder="https://...">
          <div class="hint">비워두면 기본 그라데이션 썸네일이 표시됩니다.</div>
        </div>
        <div class="field">
          <label for="f-excerpt">요약</label>
          <input type="text" id="f-excerpt" placeholder="리스트에 보일 한 줄 요약">
        </div>
        <div class="field">
          <label for="f-content">본문 <span class="req">*</span></label>
          <textarea id="f-content" placeholder="본문을 입력하세요. 빈 줄로 문단을 나눕니다." required></textarea>
        </div>
        <label class="check"><input type="checkbox" id="f-published" checked> 공개(게시)</label>
        <div class="form-actions">
          <button type="submit" class="btn btn-blue" id="saveBtn">등록하기</button>
          <button type="button" class="btn btn-out" id="resetBtn" hidden>취소</button>
        </div>
      </form>
    </div>

    <!-- 글 목록 -->
    <div class="card list-card">
      <div class="list-head">
        <h2>등록된 글</h2>
        <span class="count" id="count"></span>
      </div>
      <div id="list"><div class="list-state"><i class="fa-solid fa-spinner fa-spin"></i> 불러오는 중…</div></div>
    </div>

  </div>
</main>

<!-- FOOTER (공유 partial) -->
<site-footer></site-footer>

<script src="partials.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="blog-data.js"></script>
<script>
(function () {
  var db = window.AIVIEW_DB;
  var form = document.getElementById('postForm');
  var listEl = document.getElementById('list');
  var countEl = document.getElementById('count');
  var formTitle = document.getElementById('formTitle');
  var saveBtn = document.getElementById('saveBtn');
  var resetBtn = document.getElementById('resetBtn');
  var msg = document.getElementById('formMsg');
  var catList = document.getElementById('catList');
  var posts = [];

  function $(id) { return document.getElementById(id); }
  function val(id) { return $(id).value.trim(); }
  function showMsg(text, ok) {
    msg.textContent = text;
    msg.className = 'form-msg ' + (ok ? 'ok' : 'err');
    if (ok) setTimeout(function () { msg.className = 'form-msg'; }, 3000);
  }

  function enterEditMode(p) {
    $('f-id').value = p.id;
    $('f-title').value = p.title || '';
    $('f-category').value = p.category || '';
    $('f-author').value = p.author || '';
    $('f-cover').value = p.cover_url || '';
    $('f-excerpt').value = p.excerpt || '';
    $('f-content').value = p.content || '';
    $('f-published').checked = p.published !== false;
    formTitle.textContent = '글 수정';
    saveBtn.textContent = '수정 저장';
    resetBtn.hidden = false;
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function resetForm() {
    form.reset();
    $('f-id').value = '';
    $('f-published').checked = true;
    formTitle.textContent = '새 글 작성';
    saveBtn.textContent = '등록하기';
    resetBtn.hidden = true;
    msg.className = 'form-msg';
  }
  resetBtn.addEventListener('click', resetForm);

  function renderList() {
    countEl.textContent = posts.length + '개';
    if (!posts.length) {
      listEl.innerHTML = '<div class="list-state">아직 등록된 글이 없습니다. 왼쪽에서 첫 글을 작성해 보세요.</div>';
      return;
    }
    listEl.innerHTML = posts.map(function (p) {
      var thumb = p.cover_url
        ? '<img class="thumb" src="' + esc(p.cover_url) + '" alt="">'
        : '<div class="thumb"><i class="fa-solid fa-feather"></i></div>';
      var draft = p.published === false ? ' · <span class="draft">비공개</span>' : '';
      return '<div class="post-row" data-id="' + p.id + '">' +
        thumb +
        '<div class="meta">' +
          '<div class="t">' + esc(p.title) + '</div>' +
          '<div class="s">' + esc(p.category || '기타') + ' · ' + fmtDate(p.created_at) + draft + '</div>' +
        '</div>' +
        '<div class="row-actions">' +
          '<button class="icon-btn" data-act="view" title="보기"><i class="fa-solid fa-arrow-up-right-from-square"></i></button>' +
          '<button class="icon-btn" data-act="edit" title="수정"><i class="fa-solid fa-pen"></i></button>' +
          '<button class="icon-btn del" data-act="del" title="삭제"><i class="fa-solid fa-trash"></i></button>' +
        '</div>' +
      '</div>';
    }).join('');

    // 카테고리 자동완성 갱신
    var cats = [];
    posts.forEach(function (p) { if (p.category && cats.indexOf(p.category) === -1) cats.push(p.category); });
    catList.innerHTML = cats.map(function (c) { return '<option value="' + esc(c) + '">'; }).join('');
  }

  listEl.addEventListener('click', async function (e) {
    var btn = e.target.closest('button[data-act]');
    if (!btn) return;
    var row = btn.closest('.post-row');
    var id = row.getAttribute('data-id');
    var p = posts.find(function (x) { return x.id === id; });
    var act = btn.getAttribute('data-act');
    if (act === 'view') { window.open('post.html?id=' + encodeURIComponent(id), '_blank'); return; }
    if (act === 'edit') { if (p) enterEditMode(p); return; }
    if (act === 'del') {
      if (!confirm('“' + (p ? p.title : '이 글') + '”을(를) 삭제할까요? 되돌릴 수 없습니다.')) return;
      try {
        var res = await db.from('posts').delete().eq('id', id);
        if (res.error) throw res.error;
        if ($('f-id').value === id) resetForm();
        await load();
      } catch (err) { console.error('delete failed:', err); alert('삭제에 실패했습니다.'); }
    }
  });

  form.addEventListener('submit', async function (e) {
    e.preventDefault();
    if (!db) { showMsg('데이터 연결에 실패했습니다.', false); return; }
    if (!val('f-title') || !val('f-content')) { showMsg('제목과 본문은 필수입니다.', false); return; }

    var id = $('f-id').value;
    var payload = {
      title: val('f-title'),
      category: val('f-category') || null,
      author: val('f-author') || null,
      cover_url: val('f-cover') || null,
      excerpt: val('f-excerpt') || null,
      content: $('f-content').value,
      published: $('f-published').checked
    };

    saveBtn.disabled = true;
    var original = saveBtn.textContent;
    saveBtn.textContent = '저장 중…';
    try {
      var res;
      if (id) {
        payload.updated_at = new Date().toISOString();
        res = await db.from('posts').update(payload).eq('id', id);
      } else {
        res = await db.from('posts').insert(payload);
      }
      if (res.error) throw res.error;
      showMsg(id ? '수정되었습니다.' : '등록되었습니다.', true);
      resetForm();
      await load();
    } catch (err) {
      console.error('save failed:', err);
      showMsg('저장에 실패했습니다. 잠시 후 다시 시도해 주세요.', false);
    } finally {
      saveBtn.disabled = false;
      saveBtn.textContent = original;
    }
  });

  async function load() {
    if (!db) { listEl.innerHTML = '<div class="list-state">데이터 연결에 실패했습니다.</div>'; return; }
    try {
      var res = await db.from('posts').select('*').order('created_at', { ascending: false });
      if (res.error) throw res.error;
      posts = res.data || [];
      renderList();
    } catch (err) {
      console.error('list load failed:', err);
      listEl.innerHTML = '<div class="list-state">목록을 불러오지 못했습니다.</div>';
    }
  }

  load();
})();
</script>
</body>
</html>
